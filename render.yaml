# Blueprint Render (docs/07 — pont OCR démo). Déploiement : New -> Blueprint sur Render,
# pointer ce repo, Root Directory = backend/ si le repo contient plus que ce dossier.
services:
  - type: web
    name: receiptai-glass-bridge
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: DEBUG_BCC_EMAIL
        sync: false
      - key: RECEIPTAI_EMAIL
        sync: false
